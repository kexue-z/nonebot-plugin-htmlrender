[project]
site_name = "nonebot-plugin-htmlrender"
site_description = "通过渲染后端生成图片的 NoneBot 插件"
repo_url = "https://github.com/kexue-z/nonebot-plugin-htmlrender"
docs_dir = "docs"
site_dir = "site"

copyright = """
Copyright © 2026 Project Contributors. All rights reserved.
"""

[project.theme]
variant = "modern"
language = "zh"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to system preference"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["nonebot_plugin_htmlrender"]

[project.plugins.mkdocstrings.handlers.python.options]
heading_level = 3
show_root_heading = false
show_root_toc_entry = false
show_root_full_path = false
show_object_full_path = false
show_root_members_full_path = false

show_category_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true

members_order = "source"
group_by_category = true
show_submodules = false

docstring_style = "google"
docstring_section_style = "spacy"
merge_init_into_class = true
show_if_no_docstring = false
show_docstring_description = true
show_docstring_parameters = true
show_docstring_returns = true
show_docstring_raises = true
show_docstring_examples = true

show_signature = true
show_signature_annotations = true
separate_signature = true
line_length = 88

show_bases = true
show_source = true

filters = ["!^_[^_]"]
