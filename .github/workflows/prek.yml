name: Prek

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install prek
        uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # v2.0.5
        with:
          install-only: true
          prek-version: "0.3.9"

      - name: Run repository hooks
        run: prek run --all-files --show-diff-on-failure --color=always

      - name: Validate GitHub Actions workflows
        run: prek run actionlint --all-files --hook-stage=manual --show-diff-on-failure --color=always
