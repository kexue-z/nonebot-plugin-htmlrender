name: Docs PR Preview Deploy

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Never execute the PR artifact; validate its run, PR, SHA, type, and size before a scoped static deployment.
    workflows: [Docs PR Preview Build]
    types: [completed]

permissions: {}

concurrency:
  group: docs-preview-run-${{ github.event.workflow_run.head_repository.id || github.repository_id }}-${{ github.event.workflow_run.head_branch || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve preview artifact
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # Enumerate artifacts from the exact upstream run.
      contents: read
      pull-requests: read # Re-read the current PR state and head SHA.
    outputs:
      deploy: ${{ steps.preview.outputs.deploy }}
      artifact-id: ${{ steps.preview.outputs.artifact-id }}
      number: ${{ steps.preview.outputs.number }}
      head-sha: ${{ steps.preview.outputs.head-sha }}
    steps:
      - name: Resolve artifact and pull request
        id: preview
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            core.setOutput("deploy", "false");

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(process.env.RUN_ID),
                per_page: 100,
              },
            );
            const previews = artifacts.filter(
              (artifact) => artifact.name === "docs-preview-site" && !artifact.expired,
            );
            if (previews.length === 0) {
              core.notice("The pull request does not change documentation inputs.");
              return;
            }
            if (previews.length !== 1) {
              core.setFailed(`Expected one preview artifact, got ${previews.length}.`);
              return;
            }
            if (previews[0].size_in_bytes > 104857600) {
              core.setFailed("Preview artifact exceeds the 100 MiB download limit.");
              return;
            }

            let candidates = context.payload.workflow_run.pull_requests ?? [];
            if (candidates.length === 0) {
              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: process.env.RUN_HEAD_SHA,
                  per_page: 100,
                },
              );
              candidates = associated.filter(
                (pull) =>
                  pull.state === "open" &&
                  pull.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                  pull.head.sha === process.env.RUN_HEAD_SHA,
              );
            }
            if (candidates.length !== 1) {
              core.setFailed(`Expected one pull request, got ${candidates.length}.`);
              return;
            }

            const number = candidates[0].number;
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            if (pull.state !== "open") {
              core.notice(`Pull request #${number} is no longer open.`);
              return;
            }
            if (pull.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`Pull request #${number} targets another repository.`);
              return;
            }
            if (pull.head.sha !== process.env.RUN_HEAD_SHA) {
              core.notice(
                `Skipping stale preview: ${process.env.RUN_HEAD_SHA} != ${pull.head.sha}.`,
              );
              return;
            }

            core.setOutput("deploy", "true");
            core.setOutput("artifact-id", String(previews[0].id));
            core.setOutput("number", String(number));
            core.setOutput("head-sha", pull.head.sha);

  deploy:
    name: Deploy docs preview
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: docs-preview-deploy-${{ needs.resolve.outputs.number }}
      cancel-in-progress: true
    permissions:
      actions: read # Download the artifact from the exact upstream run.
      contents: write # Commit the validated static preview under gh-pages/pr-preview/.
      pages: read # Poll the legacy Pages build until the preview is live.
      pull-requests: write # Upsert the preview link comment on the associated PR.
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact-id }}
          path: site/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate untrusted site artifact
        shell: bash
        run: |
          if [[ ! -d site ]]; then
            echo "::error::Preview artifact does not contain site/."
            exit 1
          fi
          if find site -type l -print -quit | grep -q .; then
            echo "::error::Preview artifact contains a symbolic link."
            exit 1
          fi
          if find site -mindepth 1 ! -type d ! -type f -print -quit | grep -q .; then
            echo "::error::Preview artifact contains a non-regular entry."
            exit 1
          fi

          file_count=$(find site -type f | wc -l | tr -d ' ')
          byte_count=$(du -sk site | awk '{print $1 * 1024}')
          if (( file_count > 10000 || byte_count > 104857600 )); then
            echo "::error::Preview artifact exceeds the file-count or size limit."
            exit 1
          fi
          echo "Validated ${file_count} files (${byte_count} bytes)."

      - name: Deploy preview
        id: preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ needs.resolve.outputs.number }}
          action: deploy
          comment: false
          qr-code: false
          wait-for-pages-deployment: true
          deploy-commit-message: Deploy docs preview for PR #${{ needs.resolve.outputs.number }}

      - name: Update preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
        with:
          script: |
            const marker = "<!-- docs-preview -->";
            const number = Number(process.env.PR_NUMBER);
            const shortSha = process.env.HEAD_SHA.slice(0, 7);
            const body = [
              marker,
              "## Documentation preview",
              "",
              `Preview for \`${shortSha}\` is ready:`,
              `\n[Open documentation preview](${process.env.PREVIEW_URL})`,
              "",
              "The preview is replaced on every docs-related update and removed when the PR closes.",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            }
            await core.summary.addLink("Open documentation preview", process.env.PREVIEW_URL).write();
