name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish (for example, v0.7.1)
        required: true
        type: string
      debug_enabled:
        description: Enable extra build diagnostics
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify source & build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.verify.outputs.release_tag }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      version: ${{ steps.verify.outputs.version }}
    env:
      BUILD_LOG: publish-build.log
    steps:
      - name: Resolve the release tag
        id: release-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${REF_TYPE}" != "tag" ]]; then
              echo "::error::Push releases must originate from a tag."
              exit 1
            fi
            TAG="${REF_NAME}"
          else
            TAG="${RELEASE_TAG_INPUT}"
            if [[ "${REF_TYPE}" == "tag" ]]; then
              if [[ "${REF_NAME}" != "${TAG}" ]]; then
                echo "::error::Dispatch ref ${REF_NAME} does not match release_tag ${TAG}."
                exit 1
              fi
            elif [[ "${REF_TYPE}" == "branch" ]]; then
              if [[ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
                echo "::error::Manual release recovery must run from ${DEFAULT_BRANCH} or the matching tag, not ${REF_NAME}."
                exit 1
              fi
            else
              echo "::error::Unsupported workflow_dispatch ref type: ${REF_TYPE}."
              exit 1
            fi
          fi
          if [[ "${TAG}" != v* ]] || \
            ! git check-ref-format "refs/tags/${TAG}"; then
            echo "::error::Release tag must be a valid v* tag, got: ${TAG}"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.release-ref.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Verify tag, source commit, version, and lockfile
        id: verify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release-ref.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/master:refs/remotes/origin/master"
          TAG_SHA=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          if [[ "${HEAD_SHA}" != "${TAG_SHA}" ]]; then
            echo "::error::Checkout ${HEAD_SHA} does not match ${RELEASE_TAG} at ${TAG_SHA}."
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "push" ]]; then
            EVENT_COMMIT=$(git rev-parse --verify "${EVENT_SHA}^{commit}")
            if [[ "${EVENT_COMMIT}" != "${TAG_SHA}" ]]; then
              echo "::error::Push event resolves to ${EVENT_COMMIT}, not ${TAG_SHA}."
              exit 1
            fi
          fi
          if ! git merge-base --is-ancestor "${TAG_SHA}" origin/master; then
            echo "::error::Tag ${RELEASE_TAG} (${TAG_SHA}) is not on master."
            exit 1
          fi
          VERSION=$(uv version --short)
          uvx --from packaging==26.2 python - "${VERSION}" <<'PY'
          import sys

          from packaging.version import InvalidVersion, Version

          raw = sys.argv[1]
          try:
              version = Version(raw)
          except InvalidVersion as error:
              raise SystemExit(f"::error::Invalid PEP 440 project version: {error}") from error
          if str(version) != raw:
              raise SystemExit(
                  f"::error::Project version must use canonical PEP 440 spelling: {raw!r} -> {version}.",
              )
          if version.local is not None:
              raise SystemExit("::error::PyPI releases cannot use a local version segment.")
          PY
          EXPECTED_TAG="v${VERSION}"
          if [[ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match project version ${VERSION}."
            exit 1
          fi
          uv lock --check
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${TAG_SHA}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Verified ${RELEASE_TAG} at ${TAG_SHA}."

      - name: Show build context
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          uv --version

      - name: Show dependency snapshot
        if: inputs.debug_enabled
        shell: bash
        run: uv tree --locked

      - name: Build wheel and source distribution
        shell: bash
        run: |
          set -o pipefail
          uv build --no-sources --wheel --sdist 2>&1 | tee "${BUILD_LOG}"

      - name: Validate distributions
        shell: bash
        run: |
          set -euo pipefail
          uvx --from twine==6.2.0 twine check dist/*
          make verify-artifacts DIST_DIR=dist
          sha256sum dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-build-log
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: warn
          retention-days: 14

  publish-pypi:
    name: Upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write # Exchange OIDC for a short-lived PyPI credential.
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: true

  verify-pypi:
    name: Verify PyPI distribution hashes
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Match PyPI filenames and SHA-256 digests
        shell: bash
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/pypi-release.json"
          package_url="https://pypi.org/pypi/nonebot-plugin-htmlrender/${VERSION}/json"

          for attempt in $(seq 1 12); do
            if ! curl --fail --silent --show-error --location \
              --output "${metadata}" "${package_url}"; then
              status=2
            else
              set +e
              python3 - "${metadata}" dist <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import sys

          metadata_path = Path(sys.argv[1])
          dist_path = Path(sys.argv[2])
          local = {
              path.name: sha256(path.read_bytes()).hexdigest()
              for path in dist_path.iterdir()
              if path.name.endswith((".whl", ".tar.gz"))
          }
          remote_payload = json.loads(metadata_path.read_text())
          remote = {
              entry["filename"]: entry["digests"]["sha256"]
              for entry in remote_payload["urls"]
          }

          if local == remote:
              print(f"Verified {len(local)} PyPI distribution digest(s).")
              raise SystemExit(0)

          mismatched = {
              filename
              for filename in local.keys() & remote.keys()
              if local[filename] != remote[filename]
          }
          unexpected = remote.keys() - local.keys()
          if mismatched or unexpected:
              print(
                  "::error::PyPI contains mismatched or unexpected release files: "
                  f"mismatched={sorted(mismatched)}, unexpected={sorted(unexpected)}",
              )
              raise SystemExit(3)

          missing = local.keys() - remote.keys()
          print(f"PyPI metadata is not complete yet; missing={sorted(missing)}")
          raise SystemExit(2)
          PY
              status=$?
              set -e
            fi

            if [[ "${status}" == "0" ]]; then
              exit 0
            fi
            if [[ "${status}" == "3" ]]; then
              exit 1
            fi
            if [[ "${status}" != "2" ]]; then
              echo "::error::Unexpected PyPI verification failure (exit ${status})."
              exit 1
            fi
            if [[ "${attempt}" == "12" ]]; then
              echo "::error::PyPI metadata did not expose the complete verified release in time."
              exit 1
            fi
            sleep 5
          done

  github-release:
    name: Publish GitHub Release
    needs: [build, verify-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create a release and attach verified distributions.
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --target "${SOURCE_SHA}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
