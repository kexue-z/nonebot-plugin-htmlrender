name: Coverage

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: Enable extra debug diagnostics
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Keep every trusted master SHA alive: Auto Tag joins the exact push runs.
  # Pull request updates still replace stale checks for the same PR ref.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Coverage (py${{ matrix.python-version }}-${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        target:
          - runs-on: ubuntu-latest
            arch: x64
          - runs-on: ubuntu-24.04-arm
            arch: arm64

    env:
      HTMLRENDER_TEST_PROFILE: ci
      ARCH: ${{ matrix.target.arch }}
      PYTHON_VERSION: ${{ matrix.python-version }}
      COVERAGE_XML: coverage-py${{ matrix.python-version }}-${{ matrix.target.arch }}.xml
      PYTEST_LOG: pytest-py${{ matrix.python-version }}-${{ matrix.target.arch }}.log

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.11.28"
          enable-cache: true
          cache-suffix: coverage-py${{ matrix.python-version }}-${{ matrix.target.arch }}

      - name: Install Skia runtime libraries
        uses: ./.github/actions/setup-skia-runtime

      - name: Show Runner Context
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Event: ${EVENT_NAME}"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "Python: $PYTHON_VERSION, ARCH: $ARCH"
          uname -a
          df -h
          python --version
          uv --version
          if command -v lscpu >/dev/null 2>&1; then lscpu; fi

      - name: Sync deps
        run: uv sync --locked --all-extras --all-groups

      - name: Show Dependency Snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
        run: |
          uv pip list
          uv tree

      - name: Run tests with coverage
        run: |
          set -o pipefail
          uv run pytest tests \
            --cov=nonebot_plugin_htmlrender \
            --cov-report=term-missing \
            --cov-report="xml:${COVERAGE_XML}" \
            --cov-fail-under=90 \
            -ra 2>&1 | tee "${PYTEST_LOG}"

      - name: Show Failure Diagnostics
        if: ${{ failure() }}
        run: |
          echo "==== Last 200 lines of pytest log ===="
          tail -n 200 "${PYTEST_LOG}" || true
          echo "==== Environment ===="
          env | sort
          echo "==== Workspace files ===="
          ls -la

      - name: Upload Coverage + Pytest Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-debug-py${{ matrix.python-version }}-${{ matrix.target.arch }}
          path: |
            ${{ env.COVERAGE_XML }}
            ${{ env.PYTEST_LOG }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./${{ env.COVERAGE_XML }}
          flags: py${{ matrix.python-version }}-${{ matrix.target.arch }}
          env_vars: ARCH,PYTHON_VERSION
          verbose: true

  result:
    name: Coverage Matrix
    if: always()
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the complete test matrix
        shell: bash
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [[ "${COVERAGE_RESULT}" != "success" ]]; then
            echo "::error::At least one coverage matrix entry did not succeed."
            exit 1
          fi
          echo "The complete coverage matrix succeeded."
