name: Publish (TestPyPI)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: testpypi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testpypi-publish:
    name: Upload preview to TestPyPI
    # Skip PRs from forks: trusted publishing requires id-token write,
    # which is unavailable on fork PRs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testpypi
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      BUILD_LOG: publish-test-build.log
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false

      - name: Show Runner Context
        run: |
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          uv --version

      - name: Compute dev version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(uv version --short)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          DEV_VERSION="${BASE_VERSION}.dev${TIMESTAMP}"
          uv version "${DEV_VERSION}"
          echo "dev_version=${DEV_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved dev version: ${DEV_VERSION}"

      - name: Build Package
        run: |
          set -o pipefail
          uv build 2>&1 | tee "${BUILD_LOG}"

      - name: Show built distributions
        run: |
          ls -la dist
          sha256sum dist/* || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifact-testpypi
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-test-build-logs
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: warn
          retention-days: 14

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Comment install instructions on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          header: testpypi-preview
          message: |
            **TestPyPI preview published**

            Version: `${{ steps.version.outputs.dev_version }}`

            Install:

            ```bash
            pip install -i https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              nonebot-plugin-htmlrender==${{ steps.version.outputs.dev_version }}
            ```

            > Dependencies are resolved from real PyPI; only this package is taken from TestPyPI.
