name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: Enable extra debug diagnostics
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: docs-validation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs strictly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOCS_LOG: docs-build.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.11.28"
          enable-cache: true
          cache-suffix: docs-validation

      - name: Show runner context
        run: |
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          python --version
          uv --version

      - name: Sync docs dependencies
        run: uv sync --locked --group docs --no-default-groups

      - name: Show dependency snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        run: |
          uv pip list
          uv tree

      - name: Build docs
        run: |
          set -o pipefail
          uv run zensical build --strict 2>&1 | tee "${DOCS_LOG}"

      - name: Upload docs build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-build-logs
          path: ${{ env.DOCS_LOG }}
          if-no-files-found: warn
          retention-days: 14
