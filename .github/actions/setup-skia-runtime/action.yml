name: Set up Skia runtime
description: Install the Linux shared libraries required by skia-python

runs:
  using: composite
  steps:
    - name: Install Skia runtime libraries
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          libegl1 \
          libexpat1 \
          libgl1
