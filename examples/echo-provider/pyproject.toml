[project]
name = "htmlrender-echo-provider"
version = "0.1.0"
description = "Minimal third-party render engine validating the htmlrender provider SDK"
requires-python = ">=3.10"
dependencies = [
    "nonebot-plugin-htmlrender>=0.8.0,<0.9",
]

[project.entry-points."nonebot_plugin_htmlrender.providers"]
echo = "htmlrender_echo_provider:PROVIDER"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htmlrender_echo_provider"]
